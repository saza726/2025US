<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SF Travel Zen 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F5F5F7; color: #1F2937; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; border: 1px solid #E5E7EB; }
        .card:active { transform: scale(0.98); }
        .tag { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; display: inline-block; margin-right: 4px; margin-bottom: 4px;}
        .tag-food { background: #FEF3C7; color: #92400E; } /* Amber */
        .tag-tip { background: #D1FAE5; color: #065F46; } /* Emerald */
        .tag-menu { background: #FCE7F3; color: #9D174D; } /* Pink */
        .tag-res { background: #DBEAFE; color: #1E40AF; } /* Blue */
        .nav-item.active { color: #10B981; font-weight: 600; }
        .nav-item { color: #9CA3AF; transition: color 0.3s; }
        /* Hide scrollbar for clean look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full bg-white/90 backdrop-blur-sm z-50 border-b border-gray-100 pt-safe-top">
        <div class="px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-wide text-gray-800">SF Trip <span class="text-xs font-normal text-gray-500">Nov 30 - Dec 6</span></h1>
            </div>
            <div id="weather-display" class="text-sm text-gray-600 bg-gray-100 px-3 py-1 rounded-full">
                <i class="fas fa-cloud-sun text-yellow-500 mr-1"></i> Palo Alto 14°C
            </div>
        </div>
        <div class="flex overflow-x-auto px-4 pb-2 space-x-4 no-scrollbar" id="date-nav">
            </div>
    </header>

    <main class="pt-32 px-4 fade-in" id="main-container">
        </main>

    <section id="tools-container" class="hidden pt-20 px-4">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">旅行工具箱</h2>
        
        <div class="card p-5 mb-4">
            <h3 class="font-bold mb-3 flex items-center"><i class="fas fa-coins text-yellow-500 mr-2"></i> 匯率換算</h3>
            <div class="flex gap-3 items-center">
                <div class="flex-1">
                    <label class="text-xs text-gray-500">USD</label>
                    <input type="number" id="usd-input" placeholder="0" class="w-full bg-gray-50 p-2 rounded border border-gray-200 text-lg">
                </div>
                <i class="fas fa-exchange-alt text-gray-400"></i>
                <div class="flex-1">
                    <label class="text-xs text-gray-500">TWD (約 32.5)</label>
                    <input type="number" id="twd-input" readonly class="w-full bg-gray-100 p-2 rounded border border-gray-200 text-lg font-bold text-gray-700">
                </div>
            </div>
        </div>

        <div class="card p-5 mb-4">
            <h3 class="font-bold mb-3"><i class="fas fa-plane text-blue-500 mr-2"></i> 航班資訊</h3>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between border-b pb-2">
                    <span>去程 (BR18)</span>
                    <span class="font-mono font-bold">11/30 15:00 抵達 SFO</span>
                </div>
                <div class="flex justify-between">
                    <span>回程 (BR7)</span>
                    <span class="font-mono font-bold">12/06 12:00 起飛 SFO</span>
                </div>
            </div>
        </div>

        <div class="card p-5 mb-4">
            <h3 class="font-bold mb-3"><i class="fas fa-bed text-indigo-500 mr-2"></i> 住宿資訊</h3>
            <div class="mb-3">
                <div class="text-xs text-gray-500">11/30 - 12/03 (3晚)</div>
                <div class="font-medium">Sheraton Palo Alto Hotel</div>
                <a href="https://www.google.com/maps/search/?api=1&query=Sheraton+Palo+Alto+Hotel" class="text-blue-500 text-xs mt-1 block"><i class="fas fa-location-arrow"></i> 導航至飯店</a>
            </div>
            <div class="border-t pt-3">
                <div class="text-xs text-gray-500">12/03 - 12/06 (3晚)</div>
                <div class="font-medium">Hotel Citrine, Palo Alto</div>
                <a href="https://www.google.com/maps/search/?api=1&query=Hotel+Citrine+Palo+Alto" class="text-blue-500 text-xs mt-1 block"><i class="fas fa-location-arrow"></i> 導航至飯店</a>
            </div>
        </div>

        <div class="card p-5 mb-20 bg-red-50 border-red-100">
            <h3 class="font-bold mb-3 text-red-700"><i class="fas fa-exclamation-circle mr-2"></i> 緊急聯絡</h3>
            <div class="text-sm text-gray-700">
                <p>美國報警/救護車: <strong>911</strong></p>
                <p class="mt-2">外交部旅外國人急難救助: <br><strong>+1-833-388-0737</strong></p>
            </div>
        </div>
    </section>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 pb-safe-bottom z-50">
        <div class="flex justify-around py-3">
            <button class="nav-item active flex flex-col items-center" onclick="switchTab('itinerary')">
                <i class="fas fa-map-marked-alt text-xl mb-1"></i>
                <span class="text-[10px]">行程</span>
            </button>
            <button class="nav-item flex flex-col items-center" onclick="switchTab('tools')">
                <i class="fas fa-toolbox text-xl mb-1"></i>
                <span class="text-[10px]">工具</span>
            </button>
        </div>
    </nav>

    <script>
        // Data: The Itinerary
        const itineraryData = [
            {
                date: "11/30",
                day: "週日",
                weather: "13°C ☁️",
                events: [
                    { time: "15:00", title: "抵達舊金山機場 (SFO)", type: "transport", icon: "fa-plane-arrival", note: "EVA Air BR18", location: "SFO International Airport" },
                    { time: "16:30", title: "前往 Palo Alto", type: "transport", icon: "fa-car", note: "搭乘 Uber/Lyft (約40分)", location: "Sheraton Palo Alto Hotel" },
                    { time: "17:30", title: "入住 Sheraton Palo Alto", type: "stay", icon: "fa-suitcase", note: "就在 Caltrain 車站旁", location: "Sheraton Palo Alto Hotel" },
                    { time: "18:30", title: "University Ave 晚餐", type: "food", icon: "fa-utensils", note: "推薦 Burma Ruby 或 Oren's Hummus", location: "University Avenue, Palo Alto", tags: ["美食:緬甸菜", "放鬆"] }
                ]
            },
            {
                date: "12/01",
                day: "週一",
                weather: "15°C 🌤️",
                events: [
                    { time: "09:00", title: "史丹佛校園巡禮", type: "visit", icon: "fa-university", note: "參觀 Main Quad, Hoover Tower", location: "Stanford Main Quad", tags: ["拍照熱點"] },
                    { time: "12:00", title: "午餐時間", type: "food", icon: "fa-hamburger", note: "校園內 Tresidder Union", location: "Tresidder Memorial Union" },
                    { time: "14:00", title: "Cantor 藝術中心", type: "visit", icon: "fa-palette", note: "羅丹雕塑花園 (戶外)", location: "Cantor Arts Center", tags: ["必看:地獄之門"] },
                    { time: "18:00", title: "準備發表", type: "other", icon: "fa-laptop", note: "回飯店休息，整理簡報", location: "Sheraton Palo Alto Hotel" }
                ]
            },
            {
                date: "12/02",
                day: "週二",
                weather: "14°C 🌤️",
                events: [
                    { time: "08:30", title: "前往 Green Library", type: "transport", icon: "fa-bus", note: "搭乘 Marguerite Shuttle", location: "Green Library Stanford" },
                    { time: "09:00", title: "Symposium 開始", type: "visit", icon: "fa-users", note: "MingKwai, Rediscovered", location: "Green Library Stanford" },
                    { time: "14:00", title: "★ 您的發表時間", type: "highlight", icon: "fa-microphone", note: "2:00 PM - 2:30 PM", location: "Green Library Stanford", tags: ["重要:發表"] },
                    { time: "19:15", title: "Hosting Dinner @ Tai Pan", type: "food", icon: "fa-wine-glass", note: "宴請嘉賓", location: "Tai Pan Palo Alto", tags: ["重要預約:19:15", "菜單:港式飲茶/海鮮", "Dress:Smart Casual"] }
                ]
            },
            {
                date: "12/03",
                day: "週三",
                weather: "16°C ☀️",
                events: [
                    { time: "10:00", title: "換飯店 (Check-out)", type: "transport", icon: "fa-suitcase-rolling", note: "前往 Hotel Citrine", location: "Hotel Citrine Palo Alto" },
                    { time: "11:00", title: "電腦歷史博物館", type: "visit", icon: "fa-desktop", note: "打字機與早期電腦展覽", location: "Computer History Museum", tags: ["門票:需購票", "知識"] },
                    { time: "15:00", title: "Apple Park 訪客中心", type: "visit", icon: "fa-apple-alt", note: "AR體驗 & 咖啡", location: "Apple Park Visitor Center", tags: ["伴手禮:限定T恤", "拍照"] }
                ]
            },
            {
                date: "12/04",
                day: "週四",
                weather: "13°C ☁️",
                events: [
                    { time: "09:30", title: "Caltrain 往舊金山", type: "transport", icon: "fa-train", note: "San Antonio 站 -> SF 4th&King", location: "San Antonio Caltrain Station", tags: ["交通:Clipper Card"] },
                    { time: "10:30", title: "渡輪大廈 Ferry Bldg", type: "visit", icon: "fa-coffee", note: "農夫市集 & Blue Bottle", location: "San Francisco Ferry Building", tags: ["美食:藍瓶咖啡"] },
                    { time: "13:30", title: "SFMOMA 現代藝術館", type: "visit", icon: "fa-paint-brush", note: "步行可達", location: "SFMOMA", tags: ["藝文"] },
                    { time: "16:00", title: "聯合廣場 Union Sq", type: "visit", icon: "fa-shopping-bag", note: "叮噹車迴轉處", location: "Union Square San Francisco" },
                    { time: "20:00", title: "返回 Palo Alto", type: "transport", icon: "fa-train", note: "Caltrain 末班車注意", location: "San Francisco Caltrain Station" }
                ]
            },
            {
                date: "12/05",
                day: "週五",
                weather: "14°C 🌧️",
                events: [
                    { time: "10:00", title: "Stanford Shopping Ctr", type: "visit", icon: "fa-shopping-bag", note: "花園式購物中心", location: "Stanford Shopping Center", tags: ["購物:精品", "午餐:Fleming's"] },
                    { time: "14:00", title: "備選: Great Mall", type: "visit", icon: "fa-tags", note: "若想買 Outlet 折扣品", location: "Great Mall Milpitas", tags: ["購物:Outlet"] },
                    { time: "18:00", title: "最後晚餐 & 打包", type: "food", icon: "fa-utensils", note: "整理行李", location: "Hotel Citrine Palo Alto" }
                ]
            },
            {
                date: "12/06",
                day: "週六",
                weather: "13°C 🌤️",
                events: [
                    { time: "09:00", title: "前往機場 (SFO)", type: "transport", icon: "fa-taxi", note: "預留40分鐘車程", location: "SFO International Airport" },
                    { time: "12:00", title: "返程 BR7 起飛", type: "transport", icon: "fa-plane-departure", note: "平安回家", location: "SFO International Airport" }
                ]
            }
        ];

        // Logic
        let currentDayIndex = 2; // Default to Day 3 (Tuesday) for demo, or 0 for start

        function renderDateNav() {
            const nav = document.getElementById('date-nav');
            nav.innerHTML = '';
            itineraryData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-4 py-2 rounded-full text-sm transition-all ${index === currentDayIndex ? 'bg-gray-800 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}`;
                btn.innerHTML = `<div class="font-bold">${item.date}</div><div class="text-[10px] opacity-80">${item.day}</div>`;
                btn.onclick = () => {
                    currentDayIndex = index;
                    renderDateNav();
                    renderTimeline();
                    document.getElementById('weather-display').innerHTML = `<i class="fas fa-cloud-sun text-yellow-500 mr-1"></i> ${item.weather}`;
                };
                nav.appendChild(btn);
            });
        }

        function renderTimeline() {
            const container = document.getElementById('main-container');
            const dayData = itineraryData[currentDayIndex];
            container.innerHTML = '';

            // Day Header
            const header = document.createElement('div');
            header.className = "mb-6 animate-fade-in";
            header.innerHTML = `<h2 class="text-2xl font-bold text-gray-800">${dayData.day}, ${dayData.date}</h2><p class="text-gray-500 text-sm mt-1">今日行程概覽</p>`;
            container.appendChild(header);

            dayData.events.forEach(event => {
                const card = document.createElement('div');
                card.className = `card p-4 mb-4 flex flex-col gap-2 border-l-4 ${getBorderColor(event.type)}`;
                
                // Tags HTML
                let tagsHtml = '';
                if(event.tags) {
                    event.tags.forEach(tag => {
                        let tagClass = 'tag-tip';
                        if(tag.includes('美食') || tag.includes('菜單')) tagClass = 'tag-food';
                        if(tag.includes('重要')) tagClass = 'tag-menu';
                        if(tag.includes('購物') || tag.includes('伴手禮')) tagClass = 'tag-res';
                        tagsHtml += `<span class="tag ${tagClass}">${tag}</span>`;
                    });
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 shadow-sm">
                                <i class="fas ${event.icon}"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-gray-400">${event.time}</div>
                                <div class="font-bold text-gray-800 text-lg leading-tight">${event.title}</div>
                            </div>
                        </div>
                    </div>
                    
                    ${tagsHtml ? `<div class="mt-1 pl-12">${tagsHtml}</div>` : ''}
                    
                    <div class="pl-12 text-sm text-gray-600 leading-relaxed">
                        ${event.note}
                    </div>

                    <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(event.location)}" target="_blank" 
                       class="mt-3 ml-12 bg-gray-800 text-white text-center py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-location-arrow"></i> 導航前往
                    </a>
                `;
                container.appendChild(card);
            });
            
            // Spacer for bottom nav
            const spacer = document.createElement('div');
            spacer.className = "h-12";
            container.appendChild(spacer);
        }

        function getBorderColor(type) {
            switch(type) {
                case 'transport': return 'border-gray-300';
                case 'food': return 'border-yellow-400';
                case 'highlight': return 'border-red-400';
                case 'stay': return 'border-indigo-300';
                default: return 'border-green-400'; // visit
            }
        }

        function switchTab(tab) {
            const main = document.getElementById('main-container');
            const tools = document.getElementById('tools-container');
            const navItems = document.querySelectorAll('.nav-item');
            const dateNav = document.getElementById('date-nav');

            if (tab === 'itinerary') {
                main.classList.remove('hidden');
                tools.classList.add('hidden');
                dateNav.style.display = 'flex';
                navItems[0].classList.add('active');
                navItems[0].classList.remove('text-gray-400');
                navItems[1].classList.remove('active');
                navItems[1].classList.add('text-gray-400');
            } else {
                main.classList.add('hidden');
                tools.classList.remove('hidden');
                dateNav.style.display = 'none';
                navItems[1].classList.add('active');
                navItems[1].classList.remove('text-gray-400');
                navItems[0].classList.remove('active');
                navItems[0].classList.add('text-gray-400');
            }
        }

        // Currency Logic
        document.getElementById('usd-input').addEventListener('input', function(e) {
            const rate = 32.5;
            document.getElementById('twd-input').value = (e.target.value * rate).toFixed(0);
        });

        // Init
        renderDateNav();
        renderTimeline();
    </script>
</body>
</html>
